name: Release D2MXLUtils

on:
  push:
    tags:
      - "v*.*.*"
  # Manual test runs (Actions tab, or `gh workflow run release.yml`) with
  # no tag push required. Note: `github.ref_name` is the branch name in
  # this case, so `softprops/action-gh-release` creates a tag/release
  # named after the branch rather than a version — fine for verifying the
  # pipeline builds/uploads correctly, just delete the resulting tag +
  # release afterward.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      HUSKY: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate full changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output CHANGELOG.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Fix changelog spacing
        shell: bash
        run: awk '/^## /{if(seen)print"";seen=1}{print}' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

      - name: Build Tauri app (32-bit)
        run: pnpm tauri build --target i686-pc-windows-msvc

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # `github.ref_name` is only a real version on a tag push; a
          # `workflow_dispatch` test run fires with a branch name instead,
          # which `action-gh-release` rejects outright ("requires a tag").
          # Fall back to a synthetic per-run tag it auto-creates pointing
          # at the current commit — delete it after testing.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}
          name: D2MXLUtils ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual test run #{0}', github.run_number) }}
          body_path: CHANGES.md
          files: src-tauri/target/i686-pc-windows-msvc/release/d2mxlutils.exe
          draft: false
          prerelease: false

      - name: Commit and push changelog
        # Only for real tag-triggered releases — a manual workflow_dispatch
        # test run has no new tag/release notes worth persisting, and
        # skipping this avoids stray changelog commits on `master` from
        # test runs.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout master
          cp CHANGELOG.md CHANGELOG.md.new
          git checkout -- CHANGELOG.md
          mv CHANGELOG.md.new CHANGELOG.md
          git add CHANGELOG.md
          git diff --staged --quiet || { git commit -m "docs: update CHANGELOG.md" && git push origin master; }

  build-and-release-linux:
    needs: build-and-release
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      # linuxdeploy bundles an older `strip` that can't parse the
      # `.relr.dyn` ELF section newer toolchains emit by default, which
      # made it fail on every bundled .so — see the AppImage packaging
      # notes for the full story. Skipping strip just makes the AppImage
      # a bit larger.
      NO_STRIP: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            build-essential \
            libssl-dev \
            file

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (AppImage)
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles appimage

      - name: Upload AppImage to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Same tag as the Windows job's release step, so this appends to
          # the release it just created rather than trying to make a new
          # one — see that step's comment for why the fallback exists.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}
          files: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          draft: false
          prerelease: false
